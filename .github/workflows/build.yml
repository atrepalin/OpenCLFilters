name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CMake 
        uses: lukka/get-cmake@latest
        with: 
          cmakeVersion: 4.4.1

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw -y

      - name: Check tools
        shell: bash
        run: |
          g++ --version
          cmake --version

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2 --verbose

      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp build/OpenCLFilters.exe package/OpenCLFilters.exe

          cd package
          7z a ../OpenCLFilters-Windows-x64.zip OpenCLFilters.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCLFilters-Windows-x64
          path: OpenCLFilters-Windows-x64.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglvnd-dev \
            opencl-headers \
            ocl-icd-opencl-dev

      - name: Install CMake 
        uses: lukka/get-cmake@latest
        with: 
          cmakeVersion: 4.4.1

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel 2 --verbose

      - name: Package
        run: |
          mkdir -p package
          cp build/OpenCLFilters package/OpenCLFilters

          tar -C package -czf \
            OpenCLFilters-Linux-x64.tar.gz \
            OpenCLFilters

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCLFilters-Linux-x64
          path: OpenCLFilters-Linux-x64.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CMake
        run: |
          brew install cmake

      - name: Check tools
        run: |
          cmake --version
          clang++ --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          cmake --build build --config Release --parallel 2 --verbose

      - name: Check architecture
        run: |
          file build/OpenCLFilters.app/Contents/MacOS/OpenCLFilters

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/OpenCLFilters.app \
            OpenCLFilters-macOS-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCLFilters-macOS-universal
          path: OpenCLFilters-macOS-universal.zip

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: OpenCLFilters-Windows-x64
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: OpenCLFilters-Linux-x64
          path: release

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: OpenCLFilters-macOS-universal
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenCLFilters ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/OpenCLFilters-Windows-x64.zip
            release/OpenCLFilters-Linux-x64.tar.gz
            release/OpenCLFilters-macOS-universal.zip